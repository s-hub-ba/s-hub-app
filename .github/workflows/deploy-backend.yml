name: Deploy Backend API

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set. Skipping backend deploy hook."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Smoke test backend health
        env:
          BACKEND_HEALTHCHECK_URL: ${{ secrets.BACKEND_HEALTHCHECK_URL }}
        run: |
          if [ -z "$BACKEND_HEALTHCHECK_URL" ]; then
            echo "BACKEND_HEALTHCHECK_URL is not set. Skipping backend smoke test."
            exit 0
          fi

          for i in 1 2 3 4 5 6 7 8; do
            echo "Checking backend health (attempt $i)..."
            if curl -fsS "$BACKEND_HEALTHCHECK_URL" > /dev/null; then
              echo "Backend health check passed."
              exit 0
            fi
            sleep 10
          done

          echo "Backend health check failed."
          exit 1
