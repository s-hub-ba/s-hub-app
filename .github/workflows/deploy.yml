name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm rebuild @tailwindcss/oxide || true
      
      - name: Lint
        run: npm run lint

      - name: Validate API base URL secret
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "VITE_API_BASE_URL secret is not set. Falling back to default Render API URL."
            echo "VITE_API_BASE_URL=https://s-hub-app.onrender.com" >> "$GITHUB_ENV"
          else
            echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" >> "$GITHUB_ENV"
          fi
      
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_USE_HASH_ROUTER: 'true'
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
      
      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed frontend
        run: |
          SITE_URL="${{ steps.deployment.outputs.page_url }}"
          if [ -z "$SITE_URL" ]; then
            echo "Missing deployed site URL output."
            exit 1
          fi

          for i in 1 2 3 4 5; do
            echo "Checking frontend availability (attempt $i)..."
            if curl -fsSL "$SITE_URL" | grep -q "<div id=\"root\"></div>"; then
              echo "Frontend smoke test passed."
              exit 0
            fi
            sleep 8
          done

          echo "Frontend smoke test failed."
          exit 1
