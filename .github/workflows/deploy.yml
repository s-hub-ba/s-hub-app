name: Deploy to Firebase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint
      
      - name: Build
        run: npm run build
        env:
          APP_URL: ${{ secrets.APP_URL }}
      
      - name: Deploy to Firebase
        run: npx firebase deploy --only hosting --project gen-lang-client-0420059855 --token ${{ secrets.FIREBASE_TOKEN }}
