name: Build and Deploy to Firebase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm rebuild @tailwindcss/oxide || true
      
      - name: Lint
        run: npm run lint
      
      - name: Build
        run: npm run build
        env:
          APP_URL: ${{ secrets.APP_URL }}
      
      - name: Deploy to Firebase
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx firebase-tools@latest deploy --only hosting --project gen-lang-client-0420059855 --token ${{ secrets.FIREBASE_TOKEN }}
